services:
  - type: web
    name: iron-arc-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: MAX_PLAN_GENERATIONS_PER_HOUR
        value: "5"
      - key: MAX_REQUESTS_PER_MINUTE
        value: "30"
