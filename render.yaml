# What the Render service runs. The live service (iron-arc-backend-v2) was set
# up in the Render dashboard, which is what Render actually uses: change the
# build or start command there too. Render sets PORT itself.
services:
  - type: web
    name: iron-arc-backend-v2
    runtime: node
    # npm ci installs exactly package-lock.json and generates the Prisma client
    # (postinstall); then any new database migrations are applied.
    buildCommand: npm ci && npx prisma migrate deploy
    startCommand: node src/app.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_TIMEOUT_MS
        value: "30000"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: MAX_PLAN_GENERATIONS_PER_HOUR
        value: "5"
      - key: MAX_PLAN_CHATS_PER_HOUR
        value: "30"
